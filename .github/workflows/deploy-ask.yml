name: Deploy ask.rsg.com.tw

# 觸發：main 分支上 rsg-ask 或 rsg-edge 有變動，或手動觸發。
# 需要在 GitHub repo Settings → Secrets and variables → Actions 設定：
#   CLOUDFLARE_API_TOKEN   權限：Account → Workers Scripts:Edit；Zone(rsg.com.tw) → Workers Routes:Edit、DNS:Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 儀表板右側「帳戶 ID」
on:
  push:
    branches: [main]
    paths:
      - "rsg-ask/**"
      - "rsg-edge/**"
      - ".github/workflows/deploy-ask.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ask
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 建置問答站（子網域模式，含未定稿頁供業主預覽；未定稿頁 noindex 且不進 sitemap）
        working-directory: rsg-edge
        run: npm run build:subdomain:preview

      - name: 建置結果摘要
        run: |
          echo "approved pages in sitemap: $(grep -c '<url>' rsg-ask/dist/sitemap.xml)"
          ls rsg-ask/dist | head -40

      - name: 部署到 Cloudflare Workers（ask.rsg.com.tw）
        working-directory: rsg-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --env subdomain
